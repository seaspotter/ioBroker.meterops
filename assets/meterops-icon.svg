<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E5AAC"/>
      <stop offset="55%" stop-color="#2E9AAC"/>
      <stop offset="100%" stop-color="#35B26A"/>
    </linearGradient>
  </defs>

  <!-- bezel -->
  <circle cx="160" cy="160" r="148" fill="#1B2733"/>
  <circle cx="160" cy="160" r="132" fill="#F4F7F9"/>

  <!-- baseline -->
  <line x1="88" y1="216" x2="232" y2="216" stroke="#1B2733" stroke-width="6" stroke-linecap="round"/>

  <!-- ascending bars (history) -->
  <rect x="100" y="184" width="26" height="32" rx="4" fill="#2E5AAC"/>
  <rect x="147" y="156" width="26" height="60" rx="4" fill="#2E86A6"/>
  <rect x="194" y="120" width="26" height="96" rx="4" fill="#35B26A"/>

  <!-- trend line with data points, rising above the bars -->
  <polyline points="90,170 135,140 182,104 228,84"
            fill="none" stroke="#D8482F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="170" r="8" fill="#F4F7F9" stroke="#D8482F" stroke-width="6"/>
  <circle cx="135" cy="140" r="8" fill="#F4F7F9" stroke="#D8482F" stroke-width="6"/>
  <circle cx="182" cy="104" r="8" fill="#F4F7F9" stroke="#D8482F" stroke-width="6"/>
  <circle cx="228" cy="84" r="9" fill="#D8482F"/>
</svg>
